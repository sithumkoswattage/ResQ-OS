# Local full-stack run:  JWT_SECRET=<random 16+ chars> docker compose up --build
# App: http://localhost:8081   API: http://localhost:5000/api
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"   # host-only, so seed scripts can run from backend/
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/resqos
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random string of 16+ characters}
      CORS_ORIGINS: http://localhost:8081
      TRUST_PROXY: 1
      # Containers have no IPv6, and Node's fetch gives each address only 250 ms
      # by default - too short for slow links to the routing server.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  mongo-data:
